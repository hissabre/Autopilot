name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds publish a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app folder (Python bundled)
        run: pyinstaller build/autopilot.spec --noconfirm --distpath dist --workpath build/tmp

      - name: Smoke test — the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Autopilot\Autopilot.exe" -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Autopilot.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $env:APP_VERSION = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Autopilot-Setup
          path: dist/Autopilot-Setup.exe

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Autopilot-Setup.exe
